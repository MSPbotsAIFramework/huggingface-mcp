services:
  huggingface-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: huggingface-mcp:latest
    container_name: huggingface-mcp-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes: {}
